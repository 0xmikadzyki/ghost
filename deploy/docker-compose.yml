# ClickHouse for rhflow. Bring up: see deploy/README.md.
#
# Auth: none. The server listens on 127.0.0.1 only (host network + listen_host in
# clickhouse/config.xml, default user restricted to loopback in clickhouse/users.xml),
# so nothing off the box can reach it and there is no password to keep anywhere.
# Memory: 10 GB server cap, 6 GB per query, 8 threads (clickhouse/*.xml).
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.32.14
    container_name: rhflow-ch
    restart: unless-stopped
    network_mode: host                 # binds 127.0.0.1:8123 (HTTP) and :9000 (native) directly
    environment:
      CLICKHOUSE_DO_NOT_CHOWN: "1"     # data dir is pre-chowned to 101:101 (README); shards are read-only
    volumes:
      - /root/rhflow/ch:/var/lib/clickhouse
      - /root/rhflow/data/transfers:/var/lib/clickhouse/user_files/transfers:ro
      # overrides the image's own file of the same name, which would listen on 0.0.0.0/::
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/docker_related_config.xml:ro
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/rhflow.xml:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 6
